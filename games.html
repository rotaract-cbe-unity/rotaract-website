<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - Rotaract Club of Coimbatore Unity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/duoy1cje9/image/upload/v1783501797/unity_standard_colour_mkz1k7.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============================================================
           GAMES PAGE STYLES
           ============================================================ */
        :root {
            --primary: #0057b7;
            --accent: #00b4d8;
            --font: 'Poppins', sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0a0a1a;
            --bg2: #111128;
            --bg3: #1a1a36;
            --card: rgba(20,20,50,0.6);
            --text: #f0f0f5;
            --text2: #b0b0c8;
            --text3: #7878a0;
            --border: rgba(100,100,180,0.15);
            --glass: rgba(15,15,45,0.55);
        }

        [data-theme="light"] {
            --bg: #f5f7fc;
            --bg2: #edf0f8;
            --bg3: #e2e6f0;
            --card: rgba(255,255,255,0.7);
            --text: #1a1a2e;
            --text2: #4a4a6a;
            --text3: #8888a8;
            --border: rgba(0,0,0,0.1);
            --glass: rgba(255,255,255,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: all 0.3s ease;
            overflow-x: hidden;
        }

        /* Header */
        .games-header {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
        }

        .games-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .games-header-left img { height: 36px; }

        .games-header-left h1 {
            font-size: 1rem;
            font-weight: 700;
        }

        .games-header-left span {
            font-size: 0.78rem;
            color: var(--text3);
        }

        .games-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text2);
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn:hover { border-color: var(--primary); color: var(--primary); }
        .header-btn svg { width: 16px; height: 16px; }

        /* Main */
        .games-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .games-title {
            text-align: center;
            margin-bottom: 32px;
        }

        .games-title h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .games-title p {
            font-size: 0.88rem;
            color: var(--text2);
        }

        /* Player Name */
        .player-section {
            text-align: center;
            margin-bottom: 28px;
        }

        .player-input-group {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 16px;
            backdrop-filter: blur(12px);
        }

        .player-input-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text2);
        }

        .player-input-group input {
            background: transparent;
            border: none;
            outline: none;
            font-family: var(--font);
            font-size: 0.88rem;
            color: var(--text);
            width: 180px;
            padding: 6px 0;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .game-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0,87,183,0.3);
            box-shadow: 0 12px 40px rgba(0,87,183,0.12);
        }

        .game-card:hover::before { opacity: 1; }

        .game-card-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
            border-radius: 14px;
            background: rgba(0,87,183,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            transition: transform 0.3s;
        }

        .game-card:hover .game-card-icon { transform: scale(1.1) rotate(-5deg); }

        .game-card h3 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .game-card p {
            font-size: 0.78rem;
            color: var(--text3);
            line-height: 1.5;
        }

        .game-card .best-score {
            margin-top: 10px;
            padding: 4px 12px;
            background: rgba(0,87,183,0.08);
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--primary);
            display: inline-block;
        }

        /* Leaderboard */
        .leaderboard-section {
            margin-top: 40px;
        }

        .leaderboard-section h3 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .leaderboard-table {
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            border-collapse: collapse;
        }

        .leaderboard-table th {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text3);
            text-transform: uppercase;
            background: rgba(0,87,183,0.05);
            border-bottom: 1px solid var(--border);
        }

        .leaderboard-table td {
            padding: 10px 16px;
            font-size: 0.82rem;
            border-bottom: 1px solid rgba(100,100,180,0.06);
        }

        .leaderboard-table tr:hover td { background: rgba(0,87,183,0.04); }

        .rank-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.75rem;
        }

        .rank-1 { background: rgba(245,158,11,0.15); color: #f59e0b; }
        .rank-2 { background: rgba(156,163,175,0.15); color: #9ca3af; }
        .rank-3 { background: rgba(180,83,9,0.15); color: #b45309; }
        .rank-other { background: rgba(0,87,183,0.08); color: var(--primary); }

        /* Game Area */
        .game-area {
            display: none;
            margin-top: 20px;
        }

        .game-area.active { display: block; }

        .game-area-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .game-area-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .game-score-display {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .game-canvas-container {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        canvas {
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            max-width: 100%;
        }

        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .game-btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font);
        }

        .game-btn-primary {
            background: linear-gradient(135deg, var(--primary), #003d82);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0,87,183,0.3);
        }

        .game-btn-primary:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .game-btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .game-btn-outline:hover { background: var(--primary); color: #fff; }

        .game-instructions {
            padding: 16px;
            background: rgba(0,87,183,0.06);
            border: 1px solid rgba(0,87,183,0.12);
            border-radius: 8px;
            margin-top: 16px;
            font-size: 0.82rem;
            color: var(--text2);
            line-height: 1.6;
        }

        /* Puzzle/Memory specific */
        .memory-grid {
            display: grid;
            gap: 8px;
            justify-content: center;
            margin: 20px auto;
        }

        .memory-card-cell {
            width: 70px;
            height: 70px;
            border-radius: 10px;
            background: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            transition: all 0.3s;
            color: transparent;
            user-select: none;
            border: 2px solid rgba(0,87,183,0.3);
        }

        .memory-card-cell.flipped,
        .memory-card-cell.matched {
            background: var(--bg3);
            color: var(--text);
            border-color: var(--accent);
        }

        .memory-card-cell.matched {
            border-color: #10b981;
            opacity: 0.7;
        }

        /* Word/Typing */
        .typing-display {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin: 20px 0;
            padding: 20px;
            background: var(--bg2);
            border-radius: 8px;
            border: 1px solid var(--border);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typing-input {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            font-size: 1rem;
            font-family: var(--font);
            background: var(--bg2);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        .typing-input:focus { border-color: var(--primary); }

        /* Quiz specific */
        .quiz-question {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .quiz-option {
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            background: var(--glass);
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-family: var(--font);
            color: var(--text);
        }

        .quiz-option:hover { border-color: var(--primary); background: rgba(0,87,183,0.06); }
        .quiz-option.correct { border-color: #10b981; background: rgba(16,185,129,0.1); }
        .quiz-option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.1); }

        /* Responsive */
        @media (max-width: 768px) {
            .games-grid { grid-template-columns: 1fr 1fr; }
            .games-header { flex-direction: column; gap: 10px; }
            .quiz-options { grid-template-columns: 1fr; }
            .memory-card-cell { width: 55px; height: 55px; font-size: 1.2rem; }
        }

        @media (max-width: 480px) {
            .games-grid { grid-template-columns: 1fr; }
            .game-canvas-container { padding: 12px; }
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="games-header">
    <div class="games-header-left">
        <img src="https://res.cloudinary.com/duoy1cje9/image/upload/v1783501797/unity_standard_colour_mkz1k7.png" alt="Logo">
        <div>
            <h1>Rotaract Club of Coimbatore Unity</h1>
            <span>Game Zone</span>
        </div>
    </div>
    <div class="games-header-right">
        <button class="header-btn" onclick="toggleGamesTheme()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            Theme
        </button>
        <a href="index.html" class="header-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Website
        </a>
    </div>
</div>

<!-- Main Container -->
<div class="games-container">
    <div class="games-title">
        <h2>Game Zone</h2>
        <p>Take a break and have fun! Play games and compete on the leaderboard.</p>
    </div>

    <!-- Player Name -->
    <div class="player-section">
        <div class="player-input-group">
            <label>Player:</label>
            <input type="text" id="playerName" placeholder="Enter your name" value="" maxlength="30">
        </div>
    </div>

    <!-- Games Selection Grid -->
    <div id="gamesGrid" class="games-grid">
        <!-- Populated by JS -->
    </div>

    <!-- Active Game Area -->
    <div id="gameArea" class="game-area"></div>

    <!-- Leaderboard -->
    <div class="leaderboard-section">
        <h3>
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            Leaderboard
        </h3>
        <table class="leaderboard-table" id="leaderboardTable">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>Game</th>
                    <th>Score</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text3);">Loading scores...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
// ============================================================
// SUPABASE & STATE
// ============================================================
const SUPABASE_URL = 'https://dledwtepuvzzztfypbgn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsZWR3dGVwdXZ6enp0ZnlwYmduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNDk2NDMsImV4cCI6MjA5ODcyNTY0M30.9ZcngwUsfl5AkFaCDR9-ljoLLOYeGwwK0AKaHfeyGhY';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentGame = null;
let gameInterval = null;
let gameScore = 0;

// ============================================================
// GAMES LIST (12 Games)
// ============================================================
const GAMES = [
    { id: 'memory', name: 'Memory Match', icon: '🧠', desc: 'Find matching pairs of cards', color: '#3b82f6' },
    { id: 'snake', name: 'Snake', icon: '🐍', desc: 'Classic snake game - eat and grow', color: '#10b981' },
    { id: 'tictactoe', name: 'Tic Tac Toe', icon: '⭕', desc: 'Classic 3x3 grid strategy game', color: '#a855f7' },
    { id: 'quiz', name: 'Rotary Quiz', icon: '❓', desc: 'Test your Rotary knowledge', color: '#f59e0b' },
    { id: 'typing', name: 'Speed Typing', icon: '⌨️', desc: 'Type words as fast as you can', color: '#ef4444' },
    { id: 'reaction', name: 'Reaction Time', icon: '⚡', desc: 'Test your reaction speed', color: '#06b6d4' },
    { id: 'math', name: 'Math Challenge', icon: '🔢', desc: 'Solve math problems quickly', color: '#8b5cf6' },
    { id: 'color', name: 'Color Match', icon: '🎨', desc: 'Match the color not the word', color: '#ec4899' },
    { id: 'wordscramble', name: 'Word Scramble', icon: '🔤', desc: 'Unscramble Rotary-related words', color: '#14b8a6' },
    { id: 'clicker', name: 'Speed Clicker', icon: '👆', desc: 'Click as many times in 10 seconds', color: '#f97316' },
    { id: 'guess', name: 'Number Guess', icon: '🎯', desc: 'Guess the number in fewest tries', color: '#6366f1' },
    { id: 'whackamole', name: 'Whack-a-Mole', icon: '🔨', desc: 'Hit the moles as they appear', color: '#d946ef' }
];

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('rcu_theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    const savedName = localStorage.getItem('rcu_player_name');
    if (savedName) document.getElementById('playerName').value = savedName;
    renderGamesGrid();
    loadLeaderboard();
});

function toggleGamesTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('rcu_theme', next);
}

function getPlayerName() {
    const name = document.getElementById('playerName')?.value.trim() || 'Anonymous';
    localStorage.setItem('rcu_player_name', name);
    return name;
}

// ============================================================
// RENDER GAMES GRID
// ============================================================
function renderGamesGrid() {
    document.getElementById('gamesGrid').innerHTML = GAMES.map(g => `
        <div class="game-card" onclick="launchGame('${g.id}')">
            <div class="game-card-icon" style="background:${g.color}22;color:${g.color};font-size:1.5rem;">${g.icon}</div>
            <h3>${g.name}</h3>
            <p>${g.desc}</p>
            <div class="best-score" id="best-${g.id}">Best: -</div>
        </div>
    `).join('');
    loadBestScores();
}

async function loadBestScores() {
    try {
        const name = getPlayerName();
        const { data } = await supa.from('game_scores').select('game_name, score').eq('player_name', name).order('score', { ascending: false });
        if (data) {
            const bests = {};
            data.forEach(d => { if (!bests[d.game_name] || d.score > bests[d.game_name]) bests[d.game_name] = d.score; });
            Object.entries(bests).forEach(([game, score]) => {
                const el = document.getElementById(`best-${game}`);
                if (el) el.textContent = `Best: ${score}`;
            });
        }
    } catch (e) { console.error(e); }
}

// ============================================================
// LEADERBOARD
// ============================================================
async function loadLeaderboard() {
    try {
        const { data } = await supa.from('game_scores').select('*').order('score', { ascending: false }).limit(50);
        const tbody = document.getElementById('leaderboardBody');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--text3);">No scores yet. Be the first!</td></tr>';
            return;
        }
        tbody.innerHTML = data.map((s, i) => `
            <tr>
                <td><span class="rank-badge ${i < 3 ? `rank-${i+1}` : 'rank-other'}">${i+1}</span></td>
                <td style="font-weight:600;">${esc(s.player_name)}</td>
                <td>${esc(GAMES.find(g=>g.id===s.game_name)?.name || s.game_name)}</td>
                <td style="font-weight:700;color:var(--primary);">${s.score}</td>
                <td style="font-size:0.75rem;color:var(--text3);">${new Date(s.created_at).toLocaleDateString()}</td>
            </tr>
        `).join('');
    } catch (e) { console.error(e); }
}

async function saveScore(gameName, score) {
    try {
        await supa.from('game_scores').insert({ player_name: getPlayerName(), game_name: gameName, score: score });
        loadLeaderboard();
        loadBestScores();
    } catch (e) { console.error(e); }
}

function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

// ============================================================
// LAUNCH GAME
// ============================================================
function launchGame(gameId) {
    if (gameInterval) { clearInterval(gameInterval); gameInterval = null; }
    currentGame = gameId;
    gameScore = 0;
    const area = document.getElementById('gameArea');
    area.classList.add('active');
    area.scrollIntoView({ behavior: 'smooth', block: 'start' });

    switch (gameId) {

function startMemory() {
    const icons = ['♠','♥','♦','♣','★','●','▲','■'];
    let cards = [...icons, ...icons].sort(() => Math.random() - 0.5);
    let flipped = [], matched = [], moves = 0;
    const area = document.getElementById('gameArea');
    area.innerHTML = gameHeader('Memory Match', 'Moves') +
        `<div class="game-canvas-container"><div class="memory-grid" style="grid-template-columns:repeat(4,70px);" id="memGrid">${cards.map((c,i) => `<div class="memory-card-cell" data-idx="${i}" data-val="${c}" onclick="flipCard(this)">${c}</div>`).join('')}</div></div><div class="game-instructions">Find all matching pairs. Click cards to flip them. Match all pairs in minimum moves!</div>`;
    window.flipCard = function(el) {
        if (flipped.length >= 2 || el.classList.contains('flipped') || el.classList.contains('matched')) return;
        el.classList.add('flipped'); flipped.push(el); moves++;
        updateScore(moves);
        if (flipped.length === 2) {
            setTimeout(() => {
                if (flipped[0].dataset.val === flipped[1].dataset.val) {
                    flipped[0].classList.add('matched'); flipped[1].classList.add('matched');
                    matched.push(flipped[0].dataset.val);
                    if (matched.length === icons.length) { endGame('memory', Math.max(100 - moves, 10), 'All Pairs Found!'); }
                } else { flipped[0].classList.remove('flipped'); flipped[1].classList.remove('flipped'); }
                flipped = [];
            }, 600);
        }
    };
}

// 2. SNAKE
// ============================================================
function startSnake() {
    const area = document.getElementById('gameArea');
    area.innerHTML = gameHeader('Snake') + `<div class="game-canvas-container"><canvas id="snakeCanvas" width="400" height="400" style="background:#111128;border:1px solid var(--border);"></canvas></div><div class="game-controls"><button class="game-btn game-btn-primary" onclick="startSnakeGame()">Start</button></div><div class="game-instructions">Use arrow keys or swipe to move. Eat the blue food to grow. Do not hit walls or yourself!</div>`;
    window.startSnakeGame = function() {
        const cv = document.getElementById('snakeCanvas'), ctx = cv.getContext('2d');
        const sz = 20, cols = cv.width/sz, rows = cv.height/sz;
        let snake = [{x:10,y:10}], dir = {x:1,y:0}, food = spawnFood(), sc = 0, speed = 120;
        function spawnFood() { return {x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)}; }
        document.onkeydown = e => { if(e.key==='ArrowUp'&&dir.y!==1)dir={x:0,y:-1};if(e.key==='ArrowDown'&&dir.y!==-1)dir={x:0,y:1};if(e.key==='ArrowLeft'&&dir.x!==1)dir={x:-1,y:0};if(e.key==='ArrowRight'&&dir.x!==-1)dir={x:1,y:0};e.preventDefault(); };
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(() => {
            const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
            if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)) { endGame('snake', sc, 'Snake Crashed!'); return; }
            snake.unshift(head);
            if(head.x===food.x&&head.y===food.y) { sc+=10; updateScore(sc); food = spawnFood(); } else snake.pop();
            ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,cv.width,cv.height);
            ctx.fillStyle='#00b4d8'; ctx.fillRect(food.x*sz,food.y*sz,sz-2,sz-2);
            snake.forEach((s,i)=>{ ctx.fillStyle=i===0?'#0057b7':'#3a8fd4'; ctx.fillRect(s.x*sz,s.y*sz,sz-2,sz-2); });
        }, speed);
    };
}

// 3. TIC TAC TOE
// ============================================================
function startTicTacToe() {
    let board = Array(9).fill(''), turn = 'X', wins = 0;
    const area = document.getElementById('gameArea');
    area.innerHTML = gameHeader('Tic Tac Toe', 'Wins') + `<div class="game-canvas-container"><div id="tttGrid" style="display:grid;grid-template-columns:repeat(3,80px);gap:6px;"></div><p id="tttMsg" style="margin-top:12px;font-weight:600;"></p></div><div class="game-instructions">Play against the computer. You are X. Try to get 3 in a row!</div>`;
    function render() {
        document.getElementById('tttGrid').innerHTML = board.map((c,i) => `<div style="width:80px;height:80px;border-radius:8px;background:var(--bg3);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900;cursor:pointer;color:${c==='X'?'var(--primary)':'var(--accent)'};" onclick="tttMove(${i})">${c}</div>`).join('');
    }
    const wins_combo = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function check(b) { for(const w of wins_combo) if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[1]]===b[w[2]]) return b[w[0]]; return b.includes('')?null:'D'; }
    window.tttMove = function(i) {
        if(board[i]||turn!=='X') return;
        board[i]='X'; turn='O';
        let r=check(board);
        if(r){ handleTTTEnd(r); return; }
        render();
        setTimeout(()=>{
            const empty=board.map((c,i)=>c===''?i:null).filter(x=>x!==null);
            // Simple AI: try to win, block, or center, or random
            let mv = empty.find(i=>{const b=[...board];b[i]='O';return check(b)==='O';});
            if(mv===undefined) mv=empty.find(i=>{const b=[...board];b[i]='X';return check(b)==='X';});
            if(mv===undefined&&board[4]==='') mv=4;
            if(mv===undefined) mv=empty[Math.floor(Math.random()*empty.length)];
            board[mv]='O'; turn='X';
            r=check(board); if(r) handleTTTEnd(r); else render();
        }, 400);
    };
    function handleTTTEnd(r) {
        if(r==='X') { wins++; updateScore(wins); }
        render();
        document.getElementById('tttMsg').textContent = r==='D'?'Draw!':r==='X'?'You Win!':'Computer Wins!';
        setTimeout(()=>{ board=Array(9).fill(''); turn='X'; document.getElementById('tttMsg').textContent=''; render(); }, 1500);
    }
    render();
}

    let sc=0, timeLeft=20;
    const area=document.getElementById('gameArea');
    area.innerHTML = gameHeader('Whack-a-Mole') + `<div class="game-canvas-container"><p style="color:var(--text3);margin-bottom:12px;">Click the moles when they appear!</p><div id="moleGrid" style="display:grid;grid-template-columns:repeat(3,90px);gap:10px;justify-content:center;"></div><p style="margin-top:14px;">Time: <strong id="moleTime">20</strong>s</p></div><div class="game-controls"><button class="game-btn game-btn-primary" onclick="startMoleGame()">Start</button></div><div class="game-instructions">Moles pop up randomly. Click them to whack them! +10 points per mole. 20 seconds!</div>`;
    function renderHoles() {
        document.getElementById('moleGrid').innerHTML = Array(9).fill(0).map((_,i)=>`<div id="hole${i}" style="width:90px;height:90px;border-radius:50%;background:var(--bg3);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:all 0.15s;user-select:none;" onclick="whackMole(${i})"></div>`).join('');
    }
    let activeHole = -1;
    window.startMoleGame = function() {
        sc=0; timeLeft=20; updateScore(0); renderHoles();
        function popMole() {
            if(activeHole>=0) { const el=document.getElementById(`hole${activeHole}`); if(el){el.textContent='';el.style.background='var(--bg3)';} }
            activeHole = Math.floor(Math.random()*9);
            const el=document.getElementById(`hole${activeHole}`);
            if(el) { el.textContent='🐹'; el.style.background='rgba(245,158,11,0.15)'; }
        }
        popMole();
        if(gameInterval) clearInterval(gameInterval);
        const moleTimer = setInterval(popMole, 800);
        gameInterval = setInterval(()=>{ timeLeft--; document.getElementById('moleTime').textContent=timeLeft;
            if(timeLeft<=0) { clearInterval(moleTimer); endGame('whackamole',sc,'Time Up!'); }
        }, 1000);
    };
    window.whackMole = function(i) {
        if(i===activeHole) {
            sc+=10; updateScore(sc);
            const el=document.getElementById(`hole${i}`);
            if(el) { el.textContent='💥'; el.style.background='rgba(16,185,129,0.15)'; setTimeout(()=>{ el.textContent=''; el.style.background='var(--bg3)'; },200); }
            activeHole=-1;
        }
    };
}
</script>
</body>
</html>
