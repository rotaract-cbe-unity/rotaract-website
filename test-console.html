<script>

    SUPABASE_URL: 'https://sbpwmkoxuokrscddhhuw.supabase.co',

        GENERATE_PDF: 'https://sbpwmkoxuokrscddhhuw.supabase.co/functions/v1/generate-pdf',

        ATTENDANCE_FORM: 'https://sbpwmkoxuokrscddhhuw.supabase.co/functions/v1/attendance-form'
    }
};

const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_SERVICE_KEY);
let stats = { success: 0, failed: 0 };

// ============================================
// LOGGING
// ============================================
function log(msg, type = 'info') {
    const console = document.getElementById('log-console');
    const time = new Date().toLocaleTimeString('en-IN', { hour12: false });
    const line = document.createElement('div');
    line.className = `log-line log-${type}`;
    line.innerHTML = `<span class="log-timestamp">[${time}]</span> ${msg}`;
    console.appendChild(line);
    console.scrollTop = console.scrollHeight;
}

function clearLog() {
    document.getElementById('log-console').innerHTML = '';
    log('Log cleared', 'info');
}

function updateStats(success) {
    if (success) stats.success++;
    else stats.failed++;
    document.getElementById('stat-success').textContent = stats.success;
    document.getElementById('stat-failed').textContent = stats.failed;
}

function showResult(elementId, result, isSuccess) {
    const el = document.getElementById(elementId);
    if (!el) return;
    el.className = `result-box ${isSuccess ? 'result-success' : 'result-error'}`;
    el.innerHTML = typeof result === 'object' ? JSON.stringify(result, null, 2) : result;
    updateStats(isSuccess);
}

// ============================================
// CONNECTION CHECK
// ============================================
async function checkConnection() {
    const statusEl = document.getElementById('status-text');
    const dotEl = document.querySelector('#connection-status .status-dot');
    try {
        const { data, error } = await db.from('site_settings').select('setting_key').limit(1);
        if (error) throw error;
        statusEl.textContent = 'Connected to Supabase';
        dotEl.className = 'status-dot status-online';
        document.getElementById('connection-status').className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-500/10 text-green-600 text-[10px] font-bold';
        log('Supabase connection established', 'success');
    } catch (e) {
        statusEl.textContent = 'Connection failed';
        dotEl.className = 'status-dot status-offline';
        document.getElementById('connection-status').className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 text-red-600 text-[10px] font-bold';
        log('Connection failed: ' + e.message, 'error');
    }
}

// ============================================
// CATEGORY SWITCHING
// ============================================
function switchCategory(cat) {
    document.querySelectorAll('.category-tab').forEach(t => t.classList.toggle('active', t.dataset.category === cat));
    const content = document.getElementById('category-content');
    switch (cat) {
        case 'emails': content.innerHTML = renderEmails(); break;
        case 'downloads': content.innerHTML = renderDownloads(); break;
        case 'attendance': content.innerHTML = renderAttendance(); break;
        case 'birthday': content.innerHTML = renderBirthday(); break;
        case 'blood': content.innerHTML = renderBlood(); break;
        case 'treasury': content.innerHTML = renderTreasury(); break;
        case 'database': content.innerHTML = renderDatabase(); break;
        case 'functions': content.innerHTML = renderFunctions(); break;
        case 'auth': content.innerHTML = renderAuth(); break;
    }
}

// DOWNLOAD TESTS
// ============================================
async function downloadPDF(type, eventId, meetingId, month, startDate, endDate) {
    const payload = { type };
    if (eventId) payload.eventId = eventId;
    if (meetingId) payload.meetingId = meetingId;
    if (month) payload.month = month;
    if (startDate) payload.startDate = startDate;
    if (endDate) payload.endDate = endDate;

    log(`Generating ${type} PDF...`, 'info');
    try {
        const res = await fetch(CONFIG.FUNCTIONS.GENERATE_PDF, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('PDF generation failed: ' + res.status);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${type}_${Date.now()}.pdf`;
        a.click();
        URL.revokeObjectURL(url);
        showResult('result-pdf-download', `Downloaded ${type}.pdf (${(blob.size/1024).toFixed(1)} KB)`, true);
        log(`PDF downloaded: ${type}`, 'success');
    } catch (e) {
        showResult('result-pdf-download', e.message, false);
        log('PDF error: ' + e.message, 'error');
    }
}

async function downloadDOCX(type, eventId, meetingId) {
    const payload = { type };
    if (eventId) payload.eventId = eventId;
    if (meetingId) payload.meetingId = meetingId;

    log(`Generating ${type} DOCX...`, 'info');
    try {
        const res = await fetch(CONFIG.FUNCTIONS.GENERATE_DOCX, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('DOCX generation failed: ' + res.status);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${type}_${Date.now()}.docx`;
        a.click();
        URL.revokeObjectURL(url);
        showResult('result-docx-download', `Downloaded ${type}.docx (${(blob.size/1024).toFixed(1)} KB)`, true);
        log(`DOCX downloaded: ${type}`, 'success');
    } catch (e) {
        showResult('result-docx-download', e.message, false);
    }
}

    const { data } = await db.from('blood_requests').select('*').eq('status', 'active').order('created_at', { ascending: false });
    const container = document.getElementById('blood-requests-list');
    if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No active requests</p>';
        return;
    }
    container.innerHTML = data.map(r => `
        <div class="p-3 rounded-xl bg-red-500/5 border border-red-500/20 text-xs">
            <div class="flex items-center justify-between">
                <div>
                    <p class="font-bold">${r.patient_name} (${r.blood_group})</p>
                    <p class="text-slate-500">${r.hospital_name} | ${r.contact_phone}</p>
                </div>
                <span class="badge badge-red">${r.urgency}</span>
            </div>
        </div>
    `).join('');
}
